<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>暖暖天氣查詢平台</title>

    <link rel="icon" type="image/png" href="./icon-v2.png">
    <link rel="apple-touch-icon" href="./icon-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --dk-bg: #f7f4ef;
            --dk-card: #fdfcf9;
            --dk-wood: #dcc9ab;
            --dk-wood-dark: #b8a27e;
            --dk-text: #5a4a3b;
            --dk-muted: #8b7d6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--dk-text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 20px;

            /* ============================================
               🪵 更明顯木紋：3層線條 + 1層噪聲
               ============================================ */
            background-color: #f4eee4;

            background-image:
                /* 深木紋線（主要紋路） */
                linear-gradient(
                    90deg,
                    rgba(150, 125, 95, 0.18) 0px,
                    rgba(150, 125, 95, 0.18) 2px,
                    rgba(255, 255, 255, 0) 2px,
                    rgba(255, 255, 255, 0) 18px
                ),
                /* 中層木紋線（自然變化） */
                linear-gradient(
                    90deg,
                    rgba(180, 155, 120, 0.12) 0px,
                    rgba(180, 155, 120, 0.12) 1px,
                    rgba(255, 255, 255, 0) 1px,
                    rgba(255, 255, 255, 0) 10px
                ),
                /* 淺木紋（增加層次） */
                linear-gradient(
                    90deg,
                    rgba(200, 185, 160, 0.08) 0px,
                    rgba(200, 185, 160, 0.08) 3px,
                    rgba(255, 255, 255, 0) 3px,
                    rgba(255, 255, 255, 0) 30px
                ),
                /* 噪聲（讓木紋不死板） */
                repeating-linear-gradient(
                    90deg,
                    rgba(0,0,0,0.02) 0px,
                    rgba(0,0,0,0.02) 1px,
                    rgba(0,0,0,0) 1px,
                    rgba(0,0,0,0) 2px
                );

            background-size: 
                20px 100%,
                12px 100%,
                36px 100%,
                3px 100%;
        }

        /* ======================== Header ========================= */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .location-pill {
            background: var(--dk-wood);
            color: var(--dk-text);
            padding: 6px 18px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .update-pill {
            font-size: 0.8rem;
            color: var(--dk-muted);
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 12px;
            border-radius: 10px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ======================== Hero Card ========================= */
        .hero-card {
            background: var(--dk-card);
            border-radius: 18px;
            padding: 28px 24px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.06);
            margin-bottom: 26px;
            position: relative;
        }

        .hero-period {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dk-wood-dark);
            color: white;
            padding: 6px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
        }

        .hero-icon {
            font-size: 4.6rem;
        }

        .hero-temp {
            font-size: 4rem;
            font-weight: 900;
            color: var(--dk-text);
        }

        .hero-desc {
            font-size: 1.35rem;
            color: var(--dk-muted);
            margin-bottom: 22px;
            font-weight: 600;
        }

        /* ======================== 建議區 ========================= */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px dashed rgba(0, 0, 0, 0.08);
        }

        .advice-item {
            background: rgba(255, 255, 255, 0.8);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .advice-icon {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .advice-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--dk-text);
            margin-bottom: 4px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--dk-text);
            margin-bottom: 14px;
            margin-left: 6px;
            font-weight: 700;
        }

        /* ======================== 捲動卡片 ========================= */
        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 14px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .mini-card {
            min-width: 130px;
            background: var(--dk-card);
            border-radius: 16px;
            padding: 16px 14px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }

        .mini-time {
            background: var(--dk-wood);
            color: var(--dk-text);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .mini-icon {
            font-size: 2.4rem;
            margin: 6px 0;
        }

        .mini-temp {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dk-text);
        }

        /* ======================== Loading ========================= */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--dk-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 4rem; animation: bounce 2s infinite;">☁️</div>
        <p style="color: var(--dk-muted); font-weight: bold; margin-top: 20px;">正在觀測雲的流動...</p>
    </div>

    <div class="status-bar">
        <div class="location-pill">🌏 臺南</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <div id="heroCard"></div>

        <h3 class="section-title">稍後預報</h3>
        <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
        const API_URL = "https://cami-weather.zeabur.app/api/weather/kaohsiung";

        function getWeatherIcon(weather) {
            if (!weather) return "🌤️";
            if (weather.includes("晴")) return "☀️";
            if (weather.includes("多雲")) return "⛅";
            if (weather.includes("陰")) return "☁️";
            if (weather.includes("雨")) return "🌧️";
            if (weather.includes("雷")) return "⛈️";
            return "🌤️";
        }

        function getAdvice(rainProb, maxTemp) {
            let rainIcon = "🌂";
            let rainText = "放心出門囉";

            if (parseInt(rainProb) > 30) {
                rainIcon = "☂️";
                rainText = "記得帶傘！";
            }

            let clothIcon = "👕";
            let clothText = "舒適穿搭";

            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🎽";
                clothText = "熱！短袖出發";
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧥";
                clothText = "加件外套";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "早晨";
            if (hour >= 11 && hour < 14) return "中午";
            if (hour >= 14 && hour < 18) return "下午";
            if (hour >= 18 && hour < 23) return "晚上";
            return "深夜";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                <div class="hero-card">
                    <div class="hero-period">${period}</div>
                    <div class="hero-temp-container">
                        <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                        <div class="hero-temp">${avgTemp}°</div>
                    </div>
                    <div class="hero-desc">${current.weather}</div>
                    
                    <div class="advice-grid">
                        <div class="advice-item">
                            <div class="advice-icon">${advice.rainIcon}</div>
                            <div class="advice-text">${advice.rainText}</div>
                            <div style="font-size:0.7rem; color:var(--dk-muted)">降雨率 ${current.rain}</div>
                        </div>
                        <div class="advice-item">
                            <div class="advice-icon">${advice.clothIcon}</div>
                            <div class="advice-text">${advice.clothText}</div>
                            <div style="font-size:0.7rem; color:var(--dk-muted)">最高溫 ${current.maxTemp}°</div>
                        </div>
                    </div>
                </div>
            `;

            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);
                const fDate = new Date(f.startTime);
                if (fDate.getDate() !== todayDate) p = "明天" + p;

                scrollContainer.innerHTML += `
                    <div class="mini-card">
                        <div class="mini-time">${p}</div>
                        <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                        <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                        <div style="font-size:0.8rem; color:var(--dk-muted); margin-top:5px;">💧${f.rain}</div>
                    </div>
                `;
            });

            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["週日","週一","週二","週三","週四","週五","週六"];

            document.getElementById('updateTime').textContent =
                `${month}月${date}日 ${days[dayIndex]}`;
        }

        async function fetchWeather() {
            try {
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));
                const fetchPromise = fetch(API_URL).then(res => res.json());

                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                alert("天氣資料讀取失敗");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>

</html>
